<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102a43" />
  <link rel="manifest" href="manifest.json" />
  <title>Wachbuch App</title>
  <style>
    :root {
      --bg: #0b1f33;
      --surface: #102a43;
      --surface-2: #163a5f;
      --text: #f0f4f8;
      --muted: #bcccdc;
      --accent: #2cb1bc;
      --danger: #d64545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #081626);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      width: min(980px, 94vw);
      margin: 24px auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: rgba(16, 42, 67, 0.85);
      border: 1px solid rgba(240, 244, 248, 0.15);
      border-radius: 14px;
      padding: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    p { margin: 0; color: var(--muted); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, textarea, select, button {
      width: 100%; border-radius: 10px; border: 1px solid rgba(240, 244, 248, 0.2);
      background: var(--surface-2); color: var(--text); padding: 10px;
    }
    textarea { min-height: 80px; resize: vertical; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button { cursor: pointer; background: var(--accent); color: #062226; border: none; font-weight: 700; }
    button.secondary { background: #486581; color: #fff; }
    button.danger { background: var(--danger); color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 10px; border-bottom: 1px solid rgba(240, 244, 248, 0.1); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    .pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: #334e68; }
  </style>
</head>
<body>
  <div class="container">
    <section class="card">
      <h1>📘 Wachbuch</h1>
      <p>Dokumentiere Vorfälle, Rundgänge und Übergaben sicher lokal auf deinem Gerät.</p>
      <div class="form-grid">
        <div>
          <label for="date">Datum & Uhrzeit</label>
          <input id="date" type="datetime-local" />
        </div>
        <div>
          <label for="guard">Mitarbeiter</label>
          <input id="guard" type="text" placeholder="z. B. M. Beispiel" />
        </div>
        <div>
          <label for="type">Kategorie</label>
          <select id="type">
            <option>Rundgang</option>
            <option>Vorkommnis</option>
            <option>Technik</option>
            <option>Übergabe</option>
          </select>
        </div>
        <div>
          <label for="location">Ort</label>
          <input id="location" type="text" placeholder="z. B. Tor 2" />
        </div>
      </div>
      <div style="margin-top:10px;">
        <label for="details">Details</label>
        <textarea id="details" placeholder="Beschreibung, Maßnahmen, Besonderheiten..."></textarea>
      </div>
      <div class="actions">
        <button id="saveBtn">Eintrag speichern</button>
        <button id="clearFormBtn" class="secondary" type="button">Formular leeren</button>
      </div>
    </section>

    <section class="card">
      <div class="form-grid" style="margin-top:0;">
        <div>
          <label for="filterType">Filter Kategorie</label>
          <select id="filterType">
            <option value="">Alle</option>
            <option>Rundgang</option>
            <option>Vorkommnis</option>
            <option>Technik</option>
            <option>Übergabe</option>
          </select>
        </div>
        <div>
          <label for="search">Suche</label>
          <input id="search" type="search" placeholder="Mitarbeiter, Ort, Details" />
        </div>
      </div>
      <div class="actions">
        <button id="exportBtn" class="secondary" type="button">JSON exportieren</button>
        <button id="deleteAllBtn" class="danger" type="button">Alle löschen</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Zeit</th><th>Mitarbeiter</th><th>Kategorie</th><th>Ort</th><th>Details</th><th></th>
          </tr>
        </thead>
        <tbody id="entries"></tbody>
      </table>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'wachbuch-eintraege-v1';
    const entriesEl = document.getElementById('entries');
    const fields = {
      date: document.getElementById('date'),
      guard: document.getElementById('guard'),
      type: document.getElementById('type'),
      location: document.getElementById('location'),
      details: document.getElementById('details')
    };

    const filterType = document.getElementById('filterType');
    const search = document.getElementById('search');

    const now = new Date();
    fields.date.value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    const loadEntries = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const saveEntries = (items) => localStorage.setItem(STORAGE_KEY, JSON.stringify(items));

    function render() {
      const typeFilter = filterType.value.trim().toLowerCase();
      const q = search.value.trim().toLowerCase();
      const data = loadEntries().filter(e => {
        const matchesType = !typeFilter || e.type.toLowerCase() === typeFilter;
        const haystack = `${e.guard} ${e.location} ${e.details}`.toLowerCase();
        const matchesSearch = !q || haystack.includes(q);
        return matchesType && matchesSearch;
      });

      entriesEl.innerHTML = data.map(e => `
        <tr>
          <td>${new Date(e.date).toLocaleString('de-DE')}</td>
          <td>${escapeHtml(e.guard)}</td>
          <td><span class="pill">${escapeHtml(e.type)}</span></td>
          <td>${escapeHtml(e.location)}</td>
          <td>${escapeHtml(e.details)}</td>
          <td><button class="danger" data-id="${e.id}">X</button></td>
        </tr>
      `).join('');
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      const entry = {
        id: crypto.randomUUID(),
        date: fields.date.value || new Date().toISOString(),
        guard: fields.guard.value.trim(),
        type: fields.type.value,
        location: fields.location.value.trim(),
        details: fields.details.value.trim()
      };

      if (!entry.guard || !entry.location || !entry.details) {
        alert('Bitte Mitarbeiter, Ort und Details ausfüllen.');
        return;
      }

      const all = loadEntries();
      all.unshift(entry);
      saveEntries(all);
      fields.details.value = '';
      render();
    });

    document.getElementById('clearFormBtn').addEventListener('click', () => {
      fields.guard.value = '';
      fields.location.value = '';
      fields.details.value = '';
    });

    entriesEl.addEventListener('click', (e) => {
      if (e.target.matches('button[data-id]')) {
        const id = e.target.dataset.id;
        saveEntries(loadEntries().filter(x => x.id !== id));
        render();
      }
    });

    document.getElementById('deleteAllBtn').addEventListener('click', () => {
      if (confirm('Wirklich alle Einträge löschen?')) {
        saveEntries([]);
        render();
      }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(loadEntries(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `wachbuch-export-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    filterType.addEventListener('change', render);
    search.addEventListener('input', render);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    render();
  </script>
</body>
</html>
